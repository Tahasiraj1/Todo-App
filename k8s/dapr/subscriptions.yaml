# Dapr declarative subscription CRDs for all 3 topics
# NOTE: Scopes not available in this Dapr CRD version (1.16.8).
# All subscriptions deliver to all Dapr apps — apps return 404 for unhandled routes
# which Dapr treats as non-retriable (drops the message for that app).
---
# task-events → backend (activity log handler)
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: task-events-subscription
  namespace: todo-app
spec:
  pubsubname: kafka-pubsub
  topic: task-events
  routes:
    default: /api/events/task-events
---
# task-events → recurring task service
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: task-events-recurring-subscription
  namespace: todo-app
spec:
  pubsubname: kafka-pubsub
  topic: task-events
  routes:
    default: /api/events/task-completed
---
# reminders → notification service
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: reminders-subscription
  namespace: todo-app
spec:
  pubsubname: kafka-pubsub
  topic: reminders
  routes:
    default: /api/events/reminders
---
# task-updates → notification service (real-time sync via WebSocket)
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: task-updates-subscription
  namespace: todo-app
spec:
  pubsubname: kafka-pubsub
  topic: task-updates
  routes:
    default: /api/events/task-updates
