# Dapr Component Contracts for Phase V
# These define the Dapr building blocks used by the application.
# Actual component YAML files will be created during implementation.

---
# 1. Kafka Pub/Sub Component
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kafka-pubsub
  namespace: todo-app
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      value: "taskflow-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
    - name: consumerGroup
      value: "todo-backend"
    - name: authRequired
      value: "false"
    - name: maxMessageBytes
      value: "1048576"

---
# 2. Declarative Subscription: task-events → backend (activity log)
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: task-events-subscription
  namespace: todo-app
spec:
  pubsubname: kafka-pubsub
  topic: task-events
  routes:
    default: /api/events/task-events
  scopes:
    - todo-backend

---
# 3. Declarative Subscription: task-events → recurring task service
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: task-events-recurring-subscription
  namespace: todo-app
spec:
  pubsubname: kafka-pubsub
  topic: task-events
  routes:
    default: /api/events/task-completed
  scopes:
    - recurring-task-service

---
# 4. Declarative Subscription: reminders → notification service
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: reminders-subscription
  namespace: todo-app
spec:
  pubsubname: kafka-pubsub
  topic: reminders
  routes:
    default: /api/events/reminders
  scopes:
    - notification-service

---
# 5. Declarative Subscription: task-updates → notification service (real-time sync)
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: task-updates-subscription
  namespace: todo-app
spec:
  pubsubname: kafka-pubsub
  topic: task-updates
  routes:
    default: /api/events/task-updates
  scopes:
    - notification-service

---
# 6. Kubernetes Secrets Store
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kubernetes-secrets
  namespace: todo-app
spec:
  type: secretstores.kubernetes
  version: v1

---
# Topic Inventory
#
# | Topic         | Producers     | Consumers                              |
# |---------------|---------------|----------------------------------------|
# | task-events   | todo-backend  | todo-backend (activity log),           |
# |               |               | recurring-task-service                 |
# | reminders     | todo-backend  | notification-service                   |
# | task-updates  | todo-backend  | notification-service (WebSocket relay) |
